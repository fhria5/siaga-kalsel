<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tes video ATCS langsung</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script></head>
<body style="background:#111;color:#eee;font-family:sans-serif;padding:16px">
<h3>Tes: stream ATCS langsung (tanpa proxy)</h3>
<p id="status">Memuat…</p>
<video id="v" controls autoplay muted playsinline style="width:100%;max-width:480px;background:#000"></video>
<script>
const url = "https://atcs.banjarmasinkota.go.id/stream/simpang_pasar_lama/index.m3u8";
const v = document.getElementById("v"), st = document.getElementById("status");
v.addEventListener("playing", () => st.textContent = "PLAYING, waktu: " + v.currentTime.toFixed(1));
v.addEventListener("error", () => st.textContent = "VIDEO ERROR: " + (v.error ? v.error.message : "?"));
if (window.Hls && Hls.isSupported()) {
  const h = new Hls();
  h.loadSource(url); h.attachMedia(v);
  h.on(Hls.Events.MANIFEST_PARSED, () => { st.textContent = "MANIFEST OK, memutar…"; v.play().catch(e => st.textContent = "PLAY GAGAL: " + e.message); });
  h.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) st.textContent = "HLS FATAL: " + d.type + "/" + d.details + (d.response ? " HTTP " + d.response.code : ""); });
} else if (v.canPlayType("application/vnd.apple.mpegurl")) {
  v.src = url; st.textContent = "Native HLS (Safari)";
} else { st.textContent = "HLS tidak didukung browser ini"; }
</script></body></html>
